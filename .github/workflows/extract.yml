
name: Extract project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Repository root has no ZIP file"
            exit 1
          fi

          mkdir -p /tmp/relapse-extract
          unzip -q "$ZIP" -d /tmp/relapse-extract

          shopt -s dotglob
          ITEMS=(/tmp/relapse-extract/*)

          if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            cp -a "${ITEMS[0]}"/. .
          else
            cp -a /tmp/relapse-extract/. .
          fi

          
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/
          git diff --cached --quiet || git commit -m "Extract project ZIP"
          git push
          
