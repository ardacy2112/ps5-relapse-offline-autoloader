
name: Build Relapse PKG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t relapse-builder .

      
      - name: Compile project
        run: |
          mkdir -p build
          chmod -R a+rwX .
          docker run --rm \
            -e HOME=/tmp \
            -e DOTNET_CLI_HOME=/tmp/DOTNET_CLI_HOME \
            -e XDG_DATA_HOME=/tmp \
            -v "$PWD:/workspace" \
            -w /workspace \
            relapse-builder \
            bash -lc "make all"
            

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relapse-build
          path: |
            build/**
            *.pkg
          if-no-files-found: warn
          
