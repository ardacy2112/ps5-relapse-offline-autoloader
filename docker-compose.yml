services:
  relapse-build:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: >
      /bin/bash -lc "make all"
    environment:
      PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
      LLVM_CONFIG: /usr/lib/llvm-18/bin/llvm-config
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "1"
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/lib/llvm-18/bin:/opt/ps5-payload-sdk/bin:/usr/share/dotnet
    stdin_open: true
    tty: true
